<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#312e81" stroke-width="8" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.25" stroke-dasharray="12 8" />

  <!-- Center Sound Waves and Voice AI visual -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="120" y="216" width="24" height="80" rx="12" fill="url(#waveGrad)" opacity="0.75" />
    <!-- Bar 2 -->
    <rect x="164" y="176" width="24" height="160" rx="12" fill="url(#waveGrad)" opacity="0.9" />
    <!-- Bar 3 -->
    <rect x="208" y="136" width="24" height="240" rx="12" fill="url(#waveGrad)" />
    <!-- Bar 4 (Center tall) -->
    <rect x="252" y="96" width="24" height="320" rx="12" fill="url(#waveGrad)" />
    <!-- Bar 5 -->
    <rect x="296" y="146" width="24" height="220" rx="12" fill="url(#waveGrad)" />
    <!-- Bar 6 -->
    <rect x="340" y="186" width="24" height="140" rx="12" fill="url(#waveGrad)" opacity="0.9" />
    <!-- Bar 7 -->
    <rect x="384" y="226" width="24" height="60" rx="12" fill="url(#waveGrad)" opacity="0.75" />
  </g>

  <!-- AI Sparkle in upper right -->
  <path d="M400 90 L406 112 L428 118 L406 124 L400 146 L394 124 L372 118 L394 112 Z" fill="url(#sparkGrad)" filter="url(#glow)" />
  <path d="M120 390 L124 404 L138 408 L124 412 L120 426 L116 412 L102 408 L116 404 Z" fill="url(#sparkGrad)" opacity="0.8" />
</svg>
